<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b16">
<title>أساطير البطاقات</title>
<style>
:root{--bg:#080b16;--panel:#11172a;--panel2:#18213a;--gold:#f5c76b;--text:#f5f7ff;--muted:#9aa5bf;--red:#ef6974;--blue:#61b1ff;--green:#61d69b;--purple:#a98cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2b3968 0,#0d1224 43%,#070a13 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{width:min(100%,560px);min-height:100vh;margin:auto;padding:12px 10px 24px;display:flex;flex-direction:column;gap:9px}
.top{display:flex;align-items:center;justify-content:space-between;padding:5px 3px}.logo{font-size:23px;font-weight:900}.logo span{color:var(--gold)}.round{font-size:11px;color:var(--muted);background:#ffffff08;padding:7px 10px;border-radius:999px;border:1px solid #ffffff10}
.arena{background:linear-gradient(180deg,#141c33,#0e1425);border:1px solid #ffffff12;border-radius:23px;padding:10px;box-shadow:0 18px 50px #0007}
.teamTitle{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 6px;font-size:12px;color:var(--muted)}.teamTitle b{color:var(--text);font-size:13px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.unit{min-width:0;background:linear-gradient(160deg,#1d2744,#10172a);border:1px solid #ffffff15;border-radius:13px;padding:6px 4px;text-align:center;transition:.15s;position:relative}.unit.dead{opacity:.32;filter:grayscale(1)}.unit.selected{border-color:var(--gold);box-shadow:0 0 0 2px #f5c76b22,0 0 20px #f5c76b18;transform:translateY(-2px)}.unit.target{border-color:#ff727b;box-shadow:0 0 0 2px #ef697422}.uicon{font-size:24px}.uname{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.mini{height:5px;background:#080b13;border-radius:9px;overflow:hidden;margin-top:5px}.mini i{display:block;height:100%;background:linear-gradient(90deg,#54d89b,#62e4b0)}.enemy .mini i{background:linear-gradient(90deg,#ef5e69,#ff9a7a)}.uhp{font-size:8px;color:var(--muted);margin-top:2px}.effect{position:absolute;top:3px;left:3px;font-size:8px;color:var(--gold)}
.vs{text-align:center;color:#68748f;font-weight:900;font-size:11px;padding:6px 0}
.energyBar{margin-top:9px;background:#080b13;border:1px solid #ffffff12;border-radius:12px;padding:7px}.energyHead{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}.energyTrack{height:9px;background:#161d30;border-radius:9px;overflow:hidden}.energyFill{height:100%;width:60%;background:linear-gradient(90deg,#5da9ff,#a98cff);transition:width .2s}.energyDots{display:flex;gap:5px;margin-top:6px}.energyDot{height:6px;flex:1;border-radius:5px;background:#252e48}.energyDot.on{background:#61b1ff;box-shadow:0 0 8px #61b1ff55}.pill{flex:1;background:#ffffff08;border:1px solid #ffffff0d;border-radius:11px;padding:6px;text-align:center;font-size:10px;color:var(--muted)}.pill b{display:block;color:var(--text);font-size:14px;margin-top:1px}
.message{min-height:38px;display:grid;place-items:center;text-align:center;color:#dce3f5;font-size:12px;padding:3px}
.handTitle{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}.handTitle b{font-size:16px}.handTitle span{font-size:10px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{text-align:right;background:linear-gradient(160deg,#1b2440,#10172b);border:1px solid #ffffff18;border-radius:18px;padding:11px;min-height:165px;box-shadow:0 8px 18px #0004;transition:.15s}.card:active{transform:scale(.97)}.card:disabled{opacity:.42}.card .icon{font-size:34px;line-height:1}.tag{float:left;font-size:9px;color:var(--gold);background:#f5c76b12;padding:4px 6px;border-radius:7px}.card h3{margin:9px 0 4px;font-size:14px}.desc{font-size:11px;color:var(--muted);line-height:1.45;min-height:29px}.cost{display:inline-flex;margin-top:6px;background:#5da9ff18;color:#8bc5ff;padding:4px 7px;border-radius:7px;font-size:9px}.controls{display:flex;gap:7px}.mainbtn{flex:1;padding:12px;border-radius:14px;font-weight:900;background:linear-gradient(135deg,#e9b95e,#f5d27e);color:#17120a}.mainbtn:disabled{opacity:.4}.ghost{padding:12px 15px;border-radius:14px;background:#ffffff09;border:1px solid #ffffff12}
.overlay{position:fixed;inset:0;background:#050711e8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.show{display:flex}.modal{width:min(100%,430px);background:linear-gradient(160deg,#1a2340,#0e1426);border:1px solid #ffffff18;border-radius:25px;padding:23px;text-align:center;box-shadow:0 30px 90px #000b}.big{font-size:60px}.modal h1{margin:7px 0;font-size:27px}.modal p{color:var(--muted);line-height:1.6;font-size:12px}
.small{font-size:10px;color:#7f8aa5;text-align:center}@media(min-width:480px){.app{padding-left:14px;padding-right:14px}.card{min-height:180px;padding:12px}.card .icon{font-size:36px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">أساطير <span>البطاقات</span></div><div class="round" id="round">الدور 1</div></div>
<section class="arena">
<div class="teamTitle"><b>فريق الخصم</b><span id="enemyCount">5 بطاقات</span></div>
<div class="board enemy" id="enemyBoard"></div>
<div class="vs">⚔️ اختر بطاقتك ثم الهدف</div>
<div class="teamTitle"><b>فريقك</b><span id="playerCount">5 بطاقات</span></div>
<div class="board" id="playerBoard"></div>
<div class="energyBar"><div class="energyHead"><span>طاقة الهجوم</span><b id="energyLabel">3 / 5</b></div><div class="energyTrack"><div class="energyFill" id="energyFill"></div></div><div class="energyDots" id="energyDots"></div></div><div class="status"><div class="pill">الطاقة<b id="energy">3</b></div><div class="pill">الدور<b id="turn">أنت</b></div><div class="pill">سلسلة<b id="combo">0</b></div></div>
<div class="message" id="message">اختر واحدة من بطاقاتك الخمس.</div>
</section>
<div class="handTitle"><b>بطاقات القدرات</b><span>كل بطاقة لها تأثير جانبي</span></div>
<section class="cards" id="cards"></section>
<div class="controls"><button class="mainbtn" id="endTurn">إنهاء الدور</button><button class="ghost" id="reset">↻</button></div>
<div class="small">نظام 5 ضد 5 — كل شخصية بطاقة مستقلة بقدرات وآثار جانبية</div>
</div>
<div class="overlay" id="overlay"><div class="modal"><div class="big" id="resultIcon">🏆</div><h1 id="resultTitle"></h1><p id="resultText"></p><button class="mainbtn" id="playAgain">مباراة جديدة</button></div></div>
<script>
const units=[
{id:"knight",name:"الفارس",icon:"⚔️",hp:26,max:26,atk:7,role:"هجوم",cost:1,desc:"ضربة قوية، لكن يتلقى 2 ضرر بعد الهجوم.",side:"ارتداد"},
{id:"guard",name:"الحارس",icon:"🛡️",hp:34,max:34,atk:4,role:"دفاع",cost:1,desc:"يقلل أول ضرر يتلقاه الفريق 5 نقاط.",side:"حصانة"},
{id:"mage",name:"الساحر",icon:"🔥",hp:20,max:20,atk:10,role:"سحر",cost:2,desc:"يصيب الهدف ويؤذي نفسه بنقطة واحدة.",side:"احتراق"},
{id:"rogue",name:"المخادع",icon:"🗡️",hp:22,max:22,atk:6,role:"سرعة",cost:1,desc:"إذا هزم هدفه يحصل الفريق على طاقة إضافية.",side:"مخاطرة"},
{id:"healer",name:"المعالج",icon:"💚",hp:24,max:24,atk:3,role:"دعم",cost:2,desc:"يعالج أضعف حليف 6 نقاط بدل الهجوم.",side:"لا يهاجم"}
];
const enemyBase=[
{id:"brute",name:"العملاق",icon:"👹",hp:32,max:32,atk:7,role:"قوة"},
{id:"shade",name:"الظل",icon:"👤",hp:22,max:22,atk:6,role:"سرعة"},
{id:"witch",name:"الساحرة",icon:"🧙",hp:20,max:20,atk:9,role:"سحر"},
{id:"beast",name:"الوحش",icon:"🐺",hp:25,max:25,atk:6,role:"هجوم"},
{id:"warden",name:"الحارس",icon:"🐲",hp:30,max:30,atk:5,role:"دفاع"}
];
let state;
function freshUnit(x){return {...x,hp:x.max,stunned:0,guarded:false};}
function newState(){state={player:units.map(freshUnit),enemy:enemyBase.map(freshUnit),energy:3,round:1,combo:0,selected:null,target:null,over:false,turn:"player",hand:[]};dealHand();render();msg("اختر بطاقة من فريقك ثم اختر هدفًا من الخصم.");}\nfunction dealHand(){state.hand=[];const pool=[...Array(units.length).keys()];while(state.hand.length<3){const i=pool.splice(Math.floor(Math.random()*pool.length),1)[0];state.hand.push(i);if(pool.length===0)break;} }
function alive(arr){return arr.filter(x=>x.hp>0);}
function msg(t){document.getElementById("message").textContent=t;}
function unitHtml(u,i,enemy){
const pct=Math.max(0,u.hp/u.max*100);
return '<button class="unit '+(u.hp<=0?"dead ":"")+(state.selected===i&&!enemy?"selected ":"")+(state.target===i&&enemy?"target ":"")+'" '+(u.hp<=0?"disabled":"")+'><span class="effect">'+(u.stunned?"💫":"")+'</span><div class="uicon">'+u.icon+'</div><div class="uname">'+u.name+'</div><div class="mini"><i style="width:'+pct+'%"></i></div><div class="uhp">'+u.hp+' / '+u.max+'</div></button>';
}
function render(){
const pb=document.getElementById("playerBoard"),eb=document.getElementById("enemyBoard");
pb.innerHTML=state.player.map((u,i)=>unitHtml(u,i,false)).join("");eb.innerHTML=state.enemy.map((u,i)=>unitHtml(u,i,true)).join("");
state.player.forEach((u,i)=>{if(u.hp>0)pb.children[i].onclick=()=>selectPlayer(i)});
state.enemy.forEach((u,i)=>{if(u.hp>0)eb.children[i].onclick=()=>selectTarget(i)});
document.getElementById("energy").textContent=state.energy;document.getElementById("energyLabel").textContent=state.energy+" / 5";document.getElementById("energyFill").style.width=(state.energy/5*100)+"%";document.getElementById("energyDots").innerHTML=Array.from({length:5},(_,i)=>"<span class=\"energyDot "+(i<state.energy?"on":"")+"\"></span>").join("");document.getElementById("round").textContent="الدور "+state.round;
document.getElementById("turn").textContent=state.turn==="player"?"أنت":"الخصم";document.getElementById("combo").textContent=state.combo;
document.getElementById("playerCount").textContent=alive(state.player).length+" بطاقات";document.getElementById("enemyCount").textContent=alive(state.enemy).length+" بطاقات";
renderCards();document.getElementById("endTurn").disabled=state.over||state.turn!=="player";
}
function renderCards(){
const wrap=document.getElementById("cards");wrap.innerHTML="";
state.hand.forEach((i)=>{const c=units[i];const b=document.createElement("button");b.className="card";const ready=state.player[i].hp>0&&state.energy>=c.cost&&state.turn==="player"&&!state.over;b.disabled=!ready;
b.innerHTML='<span class="tag">'+c.role+'</span><div class="icon">'+c.icon+'</div><h3>'+c.name+'</h3><div class="desc">'+c.desc+'</div><span class="cost">⚡ '+c.cost+' · '+c.side+'</span>';
b.onclick=()=>selectPlayer(i);wrap.appendChild(b);});
}
function selectPlayer(i){if(state.over||state.turn!=="player"||state.player[i].hp<=0)return;state.selected=i;state.target=null;msg("تم اختيار "+state.player[i].name+" — اختر بطاقة من الخصم.");render();}
function selectTarget(i){if(state.selected===null||state.over||state.turn!=="player")return;state.target=i;attack(state.selected,i);}
function attack(pi,ei){
const p=state.player[pi],e=state.enemy[ei];if(!p||!e||p.hp<=0||e.hp<=0)return;
if(state.energy< p.cost){msg("تحتاج إلى طاقة أكثر.");return;}
state.energy-=p.cost;
if(p.id==="healer"){const ally=alive(state.player).sort((a,b)=>a.hp-b.hp)[0];ally.hp=Math.min(ally.max,ally.hp+6);msg(p.name+" عالج "+ally.name+" بمقدار 6.");}
else{
let dmg=p.atk+(state.combo>=2?2:0);e.hp=Math.max(0,e.hp-dmg);msg(p.name+" هاجم "+e.name+" وسبب "+dmg+" ضرر.");
if(p.id==="knight"){p.hp=Math.max(0,p.hp-2);msg(p.name+" هاجم بقوة لكنه تلقى 2 ضرر من الارتداد.");}
if(p.id==="mage"){p.hp=Math.max(0,p.hp-1);}
if(p.id==="rogue"&&e.hp<=0)state.energy=Math.min(5,state.energy+1);
if(e.hp<=0)state.combo++;
else state.combo=0;
}
state.selected=null;state.target=null;checkWin();render();
}
function endTurn(){
if(state.over||state.turn!=="player")return;
state.turn="enemy";state.selected=null;state.target=null;render();setTimeout(enemyTurn,350);
}
function enemyTurn(){
if(state.over)return;
const foes=alive(state.player);
const attackers=alive(state.enemy);
attackers.forEach((e,idx)=>{
if(e.stunned>0){e.stunned--;return;}
const target=foes[Math.floor(Math.random()*foes.length)];if(!target||target.hp<=0)return;
let dmg=e.atk;
if(target.id==="guard"&&!target.guarded){dmg=Math.max(0,dmg-5);target.guarded=true;}
target.hp=Math.max(0,target.hp-dmg);
});
if(alive(state.player).length===0){finish(false);return;}
state.player.forEach(u=>u.guarded=false);
state.round++;state.energy=Math.min(5,state.energy+2);dealHand();state.turn="player";state.player.forEach(u=>u.guarded=false);
msg("انتهى دور الخصم. طاقتك استعادت نقطتين.");render();
}
function checkWin(){if(alive(state.enemy).length===0)finish(true);else if(alive(state.player).length===0)finish(false);}
function finish(win){state.over=true;render();document.getElementById("resultIcon").textContent=win?"🏆":"💥";document.getElementById("resultTitle").textContent=win?"انتصار!":"هُزمت";document.getElementById("resultText").textContent=win?"هزمت الفريق المنافس بخمس بطاقات لكل فريق.":"تم القضاء على فريقك. جرّب اختيار الأهداف وترتيب القدرات بشكل مختلف.";document.getElementById("overlay").classList.add("show");}
document.getElementById("endTurn").onclick=endTurn;document.getElementById("reset").onclick=newState;document.getElementById("playAgain").onclick=()=>{document.getElementById("overlay").classList.remove("show");newState();};
newState();
</script>
</body>
</html>
